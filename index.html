<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11131a">
    <meta name="description" content="A clean, keyboard-friendly calculator.">
    <title>Calc — Calculator</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section class="calculator" aria-label="Calculator">
        <header class="topbar">
          <a class="brand" href="/" aria-label="Calc home">
            <span class="brand-mark" aria-hidden="true">∑</span>
            <span>calc<span class="brand-dot">.</span></span>
          </a>
          <span class="mode-label"><span class="status-dot"></span> STANDARD</span>
        </header>

        <section class="display" aria-label="Calculator display" aria-live="polite">
          <div class="display-meta">
            <span>EXPRESSION</span>
            <button class="history-toggle" id="history-toggle" type="button" aria-expanded="false" aria-controls="history-panel">
              <span aria-hidden="true">◷</span> History
            </button>
          </div>
          <div class="expression" id="expression" aria-label="Expression">0</div>
          <div class="result-row">
            <span class="result-equals">=</span>
            <output class="result" id="result" aria-label="Result">0</output>
          </div>
          <p class="error-message" id="error-message" role="alert" hidden></p>
        </section>

        <section class="history-panel" id="history-panel" aria-label="Recent calculations" hidden>
          <div class="history-heading">
            <span>RECENT</span>
            <button class="clear-history" id="clear-history" type="button">Clear</button>
          </div>
          <ul class="history-list" id="history-list"></ul>
        </section>

        <section class="keypad" aria-label="Calculator keys">
          <button class="key key-utility" data-action="clear" type="button" aria-label="Clear all">AC</button>
          <button class="key key-utility" data-value="(" type="button" aria-label="Open parenthesis">(</button>
          <button class="key key-utility" data-value=")" type="button" aria-label="Close parenthesis">)</button>
          <button class="key key-utility" data-action="delete" type="button" aria-label="Delete last character">⌫</button>

          <button class="key key-function" data-action="sqrt" type="button" aria-label="Square root">√</button>
          <button class="key key-function" data-action="square" type="button" aria-label="Square">x²</button>
          <button class="key key-operator" data-value="/" type="button" aria-label="Divide">÷</button>
          <button class="key key-operator" data-value="*" type="button" aria-label="Multiply">×</button>

          <button class="key" data-value="7" type="button">7</button>
          <button class="key" data-value="8" type="button">8</button>
          <button class="key" data-value="9" type="button">9</button>
          <button class="key key-operator" data-value="-" type="button" aria-label="Subtract">−</button>

          <button class="key" data-value="4" type="button">4</button>
          <button class="key" data-value="5" type="button">5</button>
          <button class="key" data-value="6" type="button">6</button>
          <button class="key key-operator" data-value="+" type="button" aria-label="Add">+</button>

          <button class="key key-function" data-action="sign" type="button" aria-label="Change sign">±</button>
          <button class="key" data-value="1" type="button">1</button>
          <button class="key" data-value="2" type="button">2</button>
          <button class="key" data-value="3" type="button">3</button>

          <button class="key key-function" data-action="percent" type="button" aria-label="Percent">%</button>
          <button class="key key-zero" data-value="0" type="button">0</button>
          <button class="key" data-value="." type="button">.</button>
          <button class="key key-equals" data-action="equals" type="button" aria-label="Equals">=</button>
        </section>

        <footer class="footer">
          <span>Built for the little things.</span>
          <span class="keyboard-hint"><kbd>Enter</kbd> calculate <span aria-hidden="true">·</span> <kbd>Esc</kbd> clear</span>
        </footer>
      </section>
      <p class="page-note">A simple tool for clearer thinking.</p>
    </main>
  </body>
</html>
